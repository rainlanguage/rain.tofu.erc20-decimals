[profile.default]
src = 'src'
out = 'out'

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
evm_version = "cancun"

# optimizer settings for debugging
# via_ir = false
# optimizer = false
# optimizer_runs = 0
# optimizer_steps = 0

# optimizer settings for snapshotting.
optimizer = true
optimizer_runs = 1000000

bytecode_hash = "none"
cbor_metadata = false

# Build metadata used for testing rain meta aware contracts in this folder rather
# than expose ffi to forge.
fs_permissions = []
libs = ["dependencies"]

# `recursive_deps` is off, so every package an import resolves through is
# declared here. Nothing in this repo imports anything but forge-std: the
# concrete singleton, the deploy script and the deploy-time libraries that
# needed `rain-deploy`, `rain-extrospection` and `rain-solmem` all live in
# rain.tofu.erc20-decimals.deploy now.
[dependencies]
forge-std = "1.16.1"

[soldeer]
recursive_deps = false

# `LibTOFUTokenDecimalsProdTest` forks each of these to assert the live
# singleton is at the pinned address with the pinned codehash. Reading the
# deployment is a caller-side concern and stays here; deploying it does not.
[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
flare = "${FLARE_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
